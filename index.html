<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!--
      Tags de SEO da página. No build, scripts/prerender.ts troca o bloco
      seo:start/seo:end pelas tags do <Seo> de cada rota pública (título,
      descrição, canonical, Open Graph e JSON-LD). No navegador, o Helmet
      assume as tags marcadas com data-rh e as atualiza a cada navegação.
      Estes valores são os da home e valem só no modo de desenvolvimento.
    -->
    <!--seo:start-->
    <title data-rh="true">SlideAI: Gerador de Apresentações e Slides com IA</title>
    <meta data-rh="true" name="description" content="Crie apresentações profissionais com inteligência artificial em cerca de um minuto. Descreva o tema e receba slides editáveis, prontos para PowerPoint e PDF." />
    <meta data-rh="true" property="og:site_name" content="SlideAI" />
    <meta data-rh="true" property="og:locale" content="pt_BR" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:title" content="SlideAI: Gerador de Apresentações e Slides com IA" />
    <meta data-rh="true" property="og:description" content="Crie apresentações profissionais com inteligência artificial em cerca de um minuto. Descreva o tema e receba slides editáveis, prontos para PowerPoint e PDF." />
    <meta data-rh="true" property="og:url" content="https://slideai.com.br/" />
    <meta data-rh="true" property="og:image" content="https://slideai.com.br/og-image.png" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:image:alt" content="SlideAI: crie apresentações com IA" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="SlideAI: Gerador de Apresentações e Slides com IA" />
    <meta data-rh="true" name="twitter:description" content="Crie apresentações profissionais com inteligência artificial em cerca de um minuto. Descreva o tema e receba slides editáveis, prontos para PowerPoint e PDF." />
    <meta data-rh="true" name="twitter:image" content="https://slideai.com.br/og-image.png" />
    <!--seo:end-->
    <meta name="author" content="SlideAI" />
    <meta name="application-name" content="SlideAI" />
    <meta name="theme-color" content="#6C47FF" />
    <!-- Fallback: o host aplica os cabeçalhos reais via public/_headers. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="google-site-verification" content="1lQ8meS7qWcDLrU-KDBjP4yE5KOum5GwXjbvtXO52wQ" />

    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Fontes da interface (Plus Jakarta Sans e Inter) direto no <head>: antes
      vinham por @import no CSS, uma requisição encadeada que atrasava a
      primeira pintura. As fontes dos temas de slide carregam só quando um
      slide é renderizado (src/lib/slideFonts.ts).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

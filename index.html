    <!-- Igual a src/components/landing/faqContent.ts (src/test/landingSeo.test.ts confere). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "@id": "https://slideai.com.br/#faq",
        "inLanguage": "pt-BR",
        "isPartOf": {
          "@id": "https://slideai.com.br/#website"
        },
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Como a IA gera as apresentações?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você descreve o tema e algumas preferências (número de slides, tipo, idioma, profundidade do texto). A IA estrutura a narrativa, escreve cada slide, escolhe imagens e cria gráficos quando o conteúdo tem dados. Revise sempre o resultado: textos gerados por IA podem conter imprecisões."
            }
          },
          {
            "@type": "Question",
            "name": "Posso editar as apresentações depois?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. O editor permite mudar textos, imagens, layout, elementos visuais, animações e a ordem dos slides, além de adicionar ou remover slides. Você também pode pedir ajustes em linguagem natural ao assistente de edição."
            }
          },
          {
            "@type": "Question",
            "name": "Em quais formatos posso exportar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "PowerPoint (.pptx), PDF, imagem PNG do slide exibido e link público para apresentar em qualquer dispositivo. Com as falas dos apresentadores ativadas, o roteiro também sai em PDF, Word (.docx) ou texto."
            }
          },
          {
            "@type": "Question",
            "name": "Como funcionam os créditos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cada apresentação custa 10 créditos por slide, mais a profundidade do texto (curto 10, equilibrado 20, longo 30) e 50 se você ativar as falas dos apresentadores. O custo aparece antes de gerar, e se a geração falhar por um problema nosso os créditos voltam automaticamente."
            }
          },
          {
            "@type": "Question",
            "name": "Posso cancelar a assinatura quando quiser?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim, sem multa. Os planos PRO e MAX podem ser cancelados a qualquer momento: a renovação para e você mantém o acesso até o fim do período já pago."
            }
          },
          {
            "@type": "Question",
            "name": "E se eu me arrepender da compra?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você tem 7 dias corridos, contados da compra, para desistir e receber o reembolso integral, como prevê o Código de Defesa do Consumidor. Basta falar com o suporte; os créditos daquela compra são cancelados."
            }
          },
          {
            "@type": "Question",
            "name": "O plano MAX é mesmo ilimitado?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "É de uso ilimitado para uma pessoa, dentro da Política de Uso Justo: até 16.000 créditos por ciclo mensal (cerca de 130 apresentações de 10 slides) e 12 gerações por hora. Os detalhes estão nos Termos de Uso."
            }
          },
          {
            "@type": "Question",
            "name": "De quem é o conteúdo das apresentações?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O conteúdo que você envia continua seu, e você pode usar livremente o que gerar, inclusive comercialmente, respeitando os Termos de Uso e os direitos de terceiros. Suas apresentações são privadas até você decidir publicá-las."
            }
          },
          {
            "@type": "Question",
            "name": "Meus dados estão protegidos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Tratamos os dados conforme a LGPD, não vendemos dados pessoais e não usamos suas apresentações para treinar modelos de IA. Você pode pedir acesso, correção ou exclusão dos seus dados a qualquer momento. Veja a Política de Privacidade."
            }
          }
        ]
      }
    </script>
